name: Weekly refresh

on:
  schedule:
    # Fridays 07:30 Vancouver (PDT = UTC-7 -> 14:30 UTC; PST = UTC-8 -> 15:30 UTC).
    # GitHub cron is UTC only, so this runs at 06:30 or 07:30 local depending on DST.
    - cron: "30 14 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Scrape listings
        run: python scraper/scrape.py

      - name: Match artists and top tracks on Spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python scraper/enrich.py

      - name: Commit updated data
        run: |
          git config user.name "gigamp-bot"
          git config user.email "gigamp-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No data changes" || git commit -m "data: weekly refresh $(date -u +%F)"
          git push

      - name: Sync subscriber playlists
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN_BRIAN: ${{ secrets.SPOTIFY_REFRESH_TOKEN_BRIAN }}
        run: python sync/sync_playlists.py

